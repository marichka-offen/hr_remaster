<!doctype html>
<!-- Template for public/og-default.png (1200x630 social preview). Regenerate with: npm run og-image -->
<html>
<head>
<meta charset="utf-8">
<style>
    @font-face { font-family: "Playfair Display"; src: url("../public/fonts/PlayfairDisplay-VariableFont_wght.woff2"); font-weight: 100 900; }
    @font-face { font-family: "Cormorant Garamond"; src: url("../public/fonts/CormorantGaramond-Italic-VariableFont_wght.woff2"); font-style: italic; font-weight: 100 900; }
    @font-face { font-family: "DM Sans"; src: url("../public/fonts/DMSans-VariableFont.woff2"); font-weight: 100 900; }
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; }
    body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        text-align: center; color: #fefcf9;
        background: linear-gradient(135deg, rgba(26,35,50,.95) 0%, rgba(139,38,53,.6) 100%), #1a2332;
    }
    .frame { position: absolute; inset: 28px; border: 1px solid rgba(196,151,59,.35); }
    .eyebrow { font: 600 22px/1 "DM Sans"; letter-spacing: .3em; text-transform: uppercase; color: #c4973b; }
    h1 { font: 800 104px/1.05 "Playfair Display"; }
    .rule { width: 72px; height: 3px; background: #c4973b; }
    .quote { font: italic 500 36px/1.3 "Cormorant Garamond"; color: rgba(254,252,249,.85); max-width: 900px; }
</style>
</head>
<body>
    <div class="frame"></div>
    <p class="eyebrow">Military History &amp; Research</p>
    <h1>History<br>Reconsidered</h1>
    <div class="rule"></div>
    <p class="quote">"The further backward you look, the further forward you can see."</p>
</body>
</html>
