[build]
  command = "npm run build"
  publish = "dist"

# Old site (Vue, 2021) URLs -> new pages. Permanent, so search engines move their ranking to the new address.
# Article rules are generated from src/mocks/imported/articles.json (oldPath -> slug).
[[redirects]]
  from = "/colonial-history/british-america"
  to = "/articles/british-military-presence-america/"
  status = 301

[[redirects]]
  from = "/colonial-history/regulars-va"
  to = "/articles/british-regulars-virginia/"
  status = 301

[[redirects]]
  from = "/colonial-history/maryland-forces"
  to = "/articles/maryland-forces-1754-1764/"
  status = 301

[[redirects]]
  from = "/colonial-history/va-rangers"
  to = "/articles/virginia-ranger-companies/"
  status = 301

[[redirects]]
