  to = "/articles/battle-of-the-severn/"
  status = 301

[[redirects]]
  from = "/kent-militia"
  to = "/articles/kent-county-militia/"
  status = 301

[[redirects]]
  from = "/maryland"
  to = "/articles/military-history-of-maryland/"
  status = 301

[[redirects]]
